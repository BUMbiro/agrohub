{% extends "base.html" %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-6 offset-md-3">
        <div class="card p-4">
            <h3>Удалить статью?</h3>
            <p>Вы уверены, что хотите удалить статью <strong>«{{ post.title }}»</strong>? Это действие необратимо.</p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'blog:blogpost_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
