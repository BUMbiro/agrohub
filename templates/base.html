<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}АгроХаб{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, sans-serif; color: #1e2a2f; }
        .navbar { background: #1a3a2a !important; border-bottom: 3px solid #4caf50; }
        .navbar-brand, .navbar-nav .nav-link { color: #fff !important; }
        .navbar-nav .nav-link:hover { color: #8bc34a !important; }
        .hero { background: linear-gradient(135deg, #1a3a2a, #2e7d32); color: white; padding: 60px 20px; border-radius: 20px; margin: 20px 0; }
        .btn-primary { background: #4caf50; border: none; }
        .btn-primary:hover { background: #388e3c; }
        .card { border: none; border-radius: 16px; transition: 0.3s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .footer { background: #1a2a1f; color: #b0c8b0; padding: 20px 0; margin-top: 40px; }
        .bg-soft-green { background: #e8f5e9; }
        .section-title { border-left: 5px solid #4caf50; padding-left: 15px; margin-bottom: 30px; color: #1a3a2a; }
        .dropdown-menu { background: #1a3a2a; }
        .dropdown-item { color: #d4e8d4 !important; }
        .dropdown-item:hover { background: #2e7d32; color: #fff !important; }
    </style>
</head>
<body>
    {# Подшаблон главного меню #}
    {% include 'includes/_menu.html' %}

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="footer text-center">
        <div class="container">
            <span>&copy; 2026 АгроХаб. Все права защищены.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
