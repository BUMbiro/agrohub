<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}АгроХаб{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, sans-serif; color: #1e2a2f; }
        .navbar { background: #1a3a2a !important; border-bottom: 3px solid #4caf50; }
        .navbar-brand, .navbar-nav .nav-link { color: #fff !important; }
        .navbar-nav .nav-link:hover { color: #8bc34a !important; }
        .hero { background: linear-gradient(135deg, #1a3a2a, #2e7d32); color: white; padding: 60px 20px; border-radius: 20px; margin: 20px 0; }
        .btn-primary { background: #4caf50; border: none; }
        .btn-primary:hover { background: #388e3c; }
        .card { border: none; border-radius: 16px; transition: 0.3s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .footer { background: #1a2a1f; color: #b0c8b0; padding: 20px 0; margin-top: 40px; }
        .bg-soft-green { background: #e8f5e9; }
        .section-title { border-left: 5px solid #4caf50; padding-left: 15px; margin-bottom: 30px; color: #1a3a2a; }
        .dropdown-menu { background: #1a3a2a; }
        .dropdown-item { color: #d4e8d4 !important; }
        .dropdown-item:hover { background: #2e7d32; color: #fff !important; }

        /* Пагинация в цветах темы */
        .pagination .page-link {
            color: #1a3a2a;
            border-color: #c8e6c9;
        }
        .pagination .page-link:hover {
            background: #e8f5e9;
            color: #1a3a2a;
            border-color: #4caf50;
        }
        .pagination .page-item.active .page-link {
            background: #4caf50;
            border-color: #4caf50;
            color: #fff;
        }
        .pagination .page-item.disabled .page-link {
            color: #b0c8b0;
            background: #f4f7f6;
            border-color: #e0e0e0;
        }

        /* Разделитель между навигацией и блоком аккаунта */
        .nav-separator {
            display: inline-block;
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.3);
            margin: 0 10px;
        }

        /* Общий стиль для кнопок авторизации */
        .auth-btn {
            padding: 6px 16px !important;
            border-radius: 8px;
            font-weight: 500;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        /* Контурная кнопка "Войти" */
        .navbar-nav .nav-link.auth-btn-outline {
            border: 2px solid #8bc34a !important;
            color: #8bc34a !important;
        }
        .navbar-nav .nav-link.auth-btn-outline:hover {
            background: #8bc34a !important;
            color: #1a3a2a !important;
        }

        /* Заливная кнопка "Регистрация" */
        .navbar-nav .nav-link.auth-btn-primary {
            background: #4caf50 !important;
            color: #fff !important;
        }
        .navbar-nav .nav-link.auth-btn-primary:hover {
            background: #388e3c !important;
            color: #fff !important;
        }

        /* Кнопка авторизованного пользователя */
        .navbar-nav .nav-link.auth-btn-user {
            background: rgba(139, 195, 74, 0.15) !important;
            color: #d4e8d4 !important;
            border: 2px solid rgba(139, 195, 74, 0.4) !important;
        }
        .navbar-nav .nav-link.auth-btn-user:hover {
            background: rgba(139, 195, 74, 0.25) !important;
            color: #fff !important;
        }

        /* Адаптив: на мобильных убираем разделитель и даём отступы кнопкам */
        @media (max-width: 991px) {
            .nav-separator {
                display: none;
            }
            .auth-btn {
                margin-top: 8px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>
    {# Подшаблон главного меню #}
    {% include 'includes/_menu.html' %}

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="footer text-center">
        <div class="container">
            <span>&copy; 2026 АгроХаб. Все права защищены.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
