{% extends "base.html" %}

{% block title %}Контакты{% endblock %}

{% block content %}
<h2 class="section-title">Свяжитесь с нами</h2>
<div class="row">
    <div class="col-md-6">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Сообщение</label>
                <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </div>
    <div class="col-md-6">
        <div class="card p-3">
            <h5>Наш офис в Астрахани</h5>
            <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3A1234567890abcdef&source=constructor" width="100%" height="250" frameborder="0"></iframe>
            <p><i class="bi bi-geo-alt"></i> г. Астрахань, ул. Агрономическая, д. 1</p>
            <p><i class="bi bi-telephone"></i> +7 (8512) 12-34-56</p>
            <p><i class="bi bi-envelope"></i> info@agrohub.ru</p>
        </div>
    </div>
</div>
{% endblock %}
